name: gellsoft_rentpro
description: GellSoft RentPro - bookings and rent management for rental shops.
publish_to: "none"
version: 0.1.0+4

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  sqflite: ^2.3.3
  path: ^1.9.0
  path_provider: ^2.1.3
  shared_preferences: ^2.2.3
  intl: ^0.20.3
  pdf: ^3.13.1
  printing: ^5.15.1
  url_launcher: ^6.3.3
  file_picker: ^13.3.3
  image_picker: ^1.2.4
  flutter_local_notifications: ^23.0.1
  timezone: ^0.11.2
  crypto: ^3.0.8
  cryptography: ^2.9.0
  in_app_purchase: ^3.3.1
  in_app_purchase_android: ^0.5.5
  google_sign_in: ^7.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.3.4+4
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/icon/app_icon.png
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: assets/icon/app_icon_foreground.png

flutter:
  uses-material-design: true
  assets:
    - assets/icon/app_icon.png
    - assets/fonts/NotoSansTamil-Regular.ttf
    - assets/fonts/NotoSansTamil-Bold.ttf
